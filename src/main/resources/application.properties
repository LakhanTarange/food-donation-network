spring.application.name=FoodShareConnect
server.port=8081

spring.datasource.url=jdbc:h2:file:./data/foodshare
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Food Donation Email Notifications
foodshare.ngo-notification-emails=${NGO_EMAILS:}
foodshare.mail.from=${MAIL_FROM:}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Admin bootstrap - credentials supplied via environment
foodshare.admin.email=${ADMIN_EMAIL:}
foodshare.admin.password=${ADMIN_PASSWORD:}
